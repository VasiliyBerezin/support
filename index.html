<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support Vasilii Berezin</title>
<meta name="description" content="PayPal · IBAN · USDT TRC20 · Alfa-Bank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root {
  --bg: #f3f1ee; --ink: #141210; --muted: #6b6560; --line: #d8d3cd; --red: #d6211c; --slip: #ffffff;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121110; --ink: #f0ece6; --muted: #9a938b; --line: #2e2b28; --red: #ff3b30; --slip: #1b1a18; color-scheme: dark } }
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px; }
.langs { display: flex; gap: 6px; flex-wrap: wrap; }
.langs button { appearance: none; cursor: pointer; font: 600 12px/1 var(--mono); letter-spacing: .08em; padding: 8px 10px;
  border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 3px; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
header h1 { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 12vw, 72px); line-height: .92;
  text-transform: uppercase; margin: 0; text-wrap: balance; }
header h1 span { color: var(--red); }
header p { margin: 12px 0 0; color: var(--muted); max-width: 42ch; }
.list { display: flex; flex-direction: column; gap: 14px; }
.slip { background: var(--slip); border: 1px solid var(--line); border-radius: 4px; padding: 18px; display: grid; gap: 12px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.name { font-family: var(--display); font-size: 26px; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }
.tag { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.val { font-family: var(--mono); font-size: 17px; font-weight: 600; word-break: break-all; user-select: all; min-width: 0; }
.sub { font-size: 13px; color: var(--muted); margin-top: -6px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { appearance: none; border: 0; cursor: pointer; font: 600 15px/1.2 var(--body); padding: 14px 18px; border-radius: 3px;
  background: var(--ink); color: var(--bg); flex: 1 1 140px; text-align: center; text-decoration: none; }
.btn.red, .btn.done { background: var(--red); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:focus-visible, .langs button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.qr { padding: 12px; background: #fff; border-radius: 3px; width: fit-content; }
.qr img { display: block; width: 180px; height: 180px; image-rendering: pixelated; }
.warn { font-size: 13px; color: var(--red); font-weight: 600; }
footer { font-family: var(--mono); font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="langs" aria-label="Language">
    <button data-lang="ru">RU</button><button data-lang="en">EN</button><button data-lang="fr">FR</button>
    <button data-lang="es">ES</button><button data-lang="de">DE</button>
  </nav>

  <header>
    <h1><span data-t="h1a"></span> <span data-t="h1b"></span></h1>
    <p data-t="lead"></p>
  </header>

  <div class="list">
    <section class="slip">
      <div class="top"><div class="name">PayPal</div><div class="tag" data-t="ppTag"></div></div>
      <div class="val">@vasyaberezin</div>
      <div class="row">
        <a class="btn red" href="https://www.paypal.com/paypalme/vasyaberezin" target="_blank" rel="noopener" data-t="ppSend"></a>
        <button class="btn ghost" data-copy="@vasyaberezin" data-t="copy"></button>
      </div>
    </section>

    <section class="slip">
      <div class="top"><div class="name" data-t="bankName"></div><div class="tag">EUR · SEPA</div></div>
      <div class="val">FR76 1020 7002 0324 1965 1359 901</div>
      <div class="sub"><span data-t="benef"></span>: <b>Vasilii Berezin</b></div>
      <div class="row">
        <button class="btn" data-copy="FR7610207002032419651359901" data-t="copyIban"></button>
        <button class="btn ghost" data-copy="Vasilii Berezin" data-t="copyName"></button>
      </div>
    </section>

    <section class="slip">
      <div class="top"><div class="name">USDT</div><div class="tag" data-t="usdtTag"></div></div>
      <div class="val">TTmLZZWXF5vBggM6WEYzAMnppdMQiUhH2j</div>
      <div class="warn" data-t="usdtWarn"></div>
      <div class="qr" id="qr-usdt"></div>
      <div class="row"><button class="btn" data-copy="TTmLZZWXF5vBggM6WEYzAMnppdMQiUhH2j" data-t="copyAddr"></button></div>
    </section>

    <section class="slip">
      <div class="top"><div class="name" data-t="ruName"></div><div class="tag" data-t="ruTag"></div></div>
      <div class="val">2200 1535 1570 5417</div>
      <div class="sub"><span data-t="benef"></span>: <b data-t="darya"></b></div>
      <div class="row"><button class="btn" data-copy="2200153515705417" data-t="copyCard"></button></div>
    </section>
  </div>

  <footer data-t="thanks"></footer>
</div>

<script>
const T = {
  ru: { h1a:"Поддержать", h1b:"Васю", lead:"Василий Березин. Нажми «Скопировать» и вставь в своё банковское приложение.",
    ppTag:"любая страна", ppSend:"Отправить через PayPal", copy:"Скопировать", bankName:"Банк · IBAN", benef:"Получатель",
    copyIban:"Скопировать IBAN", copyName:"Скопировать имя", usdtTag:"сеть TRC20 (Tron)",
    usdtWarn:"Только сеть TRC20. Другая сеть = деньги потеряются.", copyAddr:"Скопировать адрес",
    ruName:"Карта РФ", ruTag:"Альфа-Банк · из России", darya:"Дарья", copyCard:"Скопировать номер карты",
    thanks:"Спасибо!", done:"Скопировано ✓", sel:"Выделено — нажми Копировать" },
  en: { h1a:"Support", h1b:"Vasya", lead:"Vasilii Berezin. Tap “Copy” and paste it into your banking app.",
    ppTag:"any country", ppSend:"Send with PayPal", copy:"Copy", bankName:"Bank · IBAN", benef:"Beneficiary",
    copyIban:"Copy IBAN", copyName:"Copy name", usdtTag:"TRC20 network (Tron)",
    usdtWarn:"TRC20 network only. Any other network and the funds are lost.", copyAddr:"Copy address",
    ruName:"Russian card", ruTag:"Alfa-Bank · from Russia", darya:"Darya", copyCard:"Copy card number",
    thanks:"Thank you!", done:"Copied ✓", sel:"Selected — press Copy" },
  fr: { h1a:"Soutenir", h1b:"Vasya", lead:"Vasilii Berezin. Appuyez sur « Copier » et collez dans votre appli bancaire.",
    ppTag:"tous pays", ppSend:"Envoyer via PayPal", copy:"Copier", bankName:"Banque · IBAN", benef:"Bénéficiaire",
    copyIban:"Copier l’IBAN", copyName:"Copier le nom", usdtTag:"réseau TRC20 (Tron)",
    usdtWarn:"Réseau TRC20 uniquement. Sur un autre réseau, les fonds sont perdus.", copyAddr:"Copier l’adresse",
    ruName:"Carte russe", ruTag:"Alfa-Bank · depuis la Russie", darya:"Darya", copyCard:"Copier le numéro",
    thanks:"Merci !", done:"Copié ✓", sel:"Sélectionné — faites Copier" },
  es: { h1a:"Apoyar a", h1b:"Vasya", lead:"Vasilii Berezin. Pulsa «Copiar» y pégalo en tu app del banco.",
    ppTag:"cualquier país", ppSend:"Enviar con PayPal", copy:"Copiar", bankName:"Banco · IBAN", benef:"Beneficiario",
    copyIban:"Copiar IBAN", copyName:"Copiar nombre", usdtTag:"red TRC20 (Tron)",
    usdtWarn:"Solo red TRC20. En otra red los fondos se pierden.", copyAddr:"Copiar dirección",
    ruName:"Tarjeta rusa", ruTag:"Alfa-Bank · desde Rusia", darya:"Darya", copyCard:"Copiar número",
    thanks:"¡Gracias!", done:"Copiado ✓", sel:"Seleccionado — pulsa Copiar" },
  de: { h1a:"Unterstütze", h1b:"Vasya", lead:"Vasilii Berezin. Auf „Kopieren“ tippen und in die Banking-App einfügen.",
    ppTag:"jedes Land", ppSend:"Mit PayPal senden", copy:"Kopieren", bankName:"Bank · IBAN", benef:"Empfänger",
    copyIban:"IBAN kopieren", copyName:"Name kopieren", usdtTag:"TRC20-Netzwerk (Tron)",
    usdtWarn:"Nur TRC20-Netzwerk. In einem anderen Netzwerk geht das Geld verloren.", copyAddr:"Adresse kopieren",
    ruName:"Russische Karte", ruTag:"Alfa-Bank · aus Russland", darya:"Darja", copyCard:"Kartennummer kopieren",
    thanks:"Danke!", done:"Kopiert ✓", sel:"Markiert — jetzt kopieren" }
};
let lang;
function setLang(l) {
  lang = T[l] ? l : 'en';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[lang][el.dataset.t]; });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  try { localStorage.setItem('lang', lang); } catch (e) {}
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
let saved = null; try { saved = localStorage.getItem('lang'); } catch (e) {}
const qs = new URLSearchParams(location.search).get('lang');
setLang(qs || saved || (navigator.language || 'en').slice(0, 2));

document.querySelectorAll('[data-copy]').forEach(b => {
  b.addEventListener('click', () => {
    const key = b.dataset.t;
    const reset = ms => setTimeout(() => { b.textContent = T[lang][key]; b.classList.remove('done'); }, ms);
    const ok = () => { b.textContent = T[lang].done; b.classList.add('done'); reset(1600); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(b.closest('.slip').querySelector('.val'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      b.textContent = T[lang].sel; reset(2200);
    };
    try { navigator.clipboard.writeText(b.dataset.copy).then(ok, fallback); } catch (e) { fallback(); }
  });
});
try {
  const q = qrcode(0, 'M'); q.addData('TTmLZZWXF5vBggM6WEYzAMnppdMQiUhH2j'); q.make();
  document.getElementById('qr-usdt').innerHTML = q.createImgTag(6, 0);
} catch (e) { document.getElementById('qr-usdt').hidden = true; }
</script>
</body>
</html>
